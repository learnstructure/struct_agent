[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "struct_agent"
version = "0.1.0"
description = "AI orchestration layer for the Structural Engineering Ecosystem."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Structural Engineering Ecosystem" }]

dependencies = [
    "struct_core",
    "aci318",
    "struct_draw",
    "fem2d",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["struct_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]